<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>
<body>

    <h1>Student Registration Form</h1>
    <p>Please complete the form below.</p>

    <form action="#" method="post">

        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name"
         required>
        

        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1" max="120" required>

        <br><br>

        <p>Education Level:</p>

        <input type="radio" id="secondary" name="education" value="secondary" required>
        <label for="secondary">Secondary School</label>

        <input type="radio" id="university" name="education" value="university">
        <label for="university">University</label>

        <br><br>

        <label for="course">Choose a course:</label>
        <select id="course" name="course" required>
            <option value="">Select a course</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javascript">JavaScript</option>
        </select>

        <br><br>

        <p>Interests:</p>

        <input type="checkbox" id="coding" name="interests" value="coding">
        <label for="coding">Coding</label>

        <input type="checkbox" id="gaming" name="interests" value="gaming">
        <label for="gaming">Gaming</label>

        <input type="checkbox" id="anime" name="interests" value="anime">
        <label for="anime">Anime</label>

        <br><br>

        <label for="message">Why do you want to learn?</label>
        <br>

        <textarea id="message" name="message" rows="4" cols="30"></textarea>

        <br><br>

        <button type="submit">Register</button>

    </form>

    <hr>

    <h2>Registered Students (Example Data)</h2>

    <table>
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Course</th>
                <th scope="col">Age</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>David</td>
                <td>HTML</td>
                <td>18</td>
            </tr>

            <tr>
                <td>Sarah</td>
                <td>CSS</td>
                <td>20</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
